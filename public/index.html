<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <link rel="manifest" href="manifest.json">
    <title>دوز آنلاین</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <section id="home">
            <header>
                <div class="logo x">✕</div>
                <div class="label_h1">
                    <h1>دوز آنلاین</h1><small>نبرد دو نفره</small>
                </div>
                <div class="logo o">○</div>
            </header>
            <div class="hero">
                <div class="orb"></div>
                <h2>آماده‌ای؟</h2>
                <p>اتاقت را بساز و کد را برای دوستت بفرست.</p>
            </div><button id="create" class="primary">ساخت بازی جدید <b>←</b></button>
            <div class="or"><i></i>یا<i></i></div>
            <div class="join"><input id="input" maxlength="6" inputmode="numeric" placeholder="کد ۶ رقمی"><button
                    id="join">ورود</button></div>
            <div id="err"></div>
        </section>
        <section id="room" class="hidden"><button class="back" id="back">‹ بازگشت</button>
            <div class="roomIcon">♟</div>
            <h2>اتاق بازی</h2>
            <p>کد را برای دوستت بفرست</p>
            <div id="code" class="code">------</div><button id="copy" class="secondary">📋 کپی کد</button>
            <div class="waiting"><span></span> منتظر بازیکن دوم...</div>
        </section>
        <section id="game" class="hidden">
            <div class="top">
                <div><small>کد اتاق</small><strong id="gcode"></strong></div>
                <div id="me" class="badge">X</div>
            </div>
            <div class="players">
                <div id="px">❌ X</div>
                <div id="po">⭕ O</div>
            </div>
            <div id="turn" class="turn">در حال اتصال...</div>
            <div id="board" class="board"></div><button id="again" class="primary hidden">بازی دوباره</button><button
                id="exit" class="back">خروج از بازی</button>
        </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
